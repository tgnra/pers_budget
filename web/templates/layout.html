{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css?v={{.V}}">
<title>{{.Title}} · Budget</title>
</head>
<body>
<nav>
  <b>Budget</b>
  <a href="/"{{if eq .Page "main"}} class="on"{{end}}>Projection</a>
  <a href="/recurring"{{if eq .Page "recurring"}} class="on"{{end}}>Recurring</a>
</nav>
<main>
{{with .Msg}}<p class="msg">{{.}}</p>{{end}}
{{with .Err}}<p class="err">{{.}}</p>{{end}}
{{template "content" .}}
</main>
<script src="/static/app.js?v={{.V}}"></script>
</body>
</html>{{end}}
